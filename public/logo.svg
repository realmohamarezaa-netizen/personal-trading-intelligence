<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- PTI v1.3.4 app icon — chrome sphere with chromatic-aberration rim -->
  <defs>
    <radialGradient id="sphere" cx="0.44" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.22" stop-color="#c9c9c9"/>
      <stop offset="0.50" stop-color="#7d7d7d"/>
      <stop offset="0.78" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#000000"/>

  <!-- chromatic aberration rim: blue top, magenta lower-left, green lower-right -->
  <g fill="none" stroke-linecap="round">
    <path d="M 92 161 A 190 190 0 0 1 420 161" stroke="#2b46ff" stroke-width="8" opacity="0.9" filter="url(#softer)"/>
    <path d="M 161 420 A 190 190 0 0 1 69 223" stroke="#e0186e" stroke-width="7" opacity="0.8" filter="url(#softer)"/>
    <path d="M 443 223 A 190 190 0 0 1 289 443" stroke="#22c55e" stroke-width="7" opacity="0.8" filter="url(#softer)"/>
  </g>

  <!-- chrome sphere -->
  <circle cx="256" cy="256" r="185" fill="url(#sphere)"/>

  <!-- depth: dark contact shadow at the lower edge -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="8" filter="url(#soft)"/>

  <!-- faint top rim light -->
  <path d="M 148 122 A 176 176 0 0 1 366 124" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" filter="url(#soft)"/>
</svg>
