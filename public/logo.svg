      <stop offset="0" stop-color="#212939"/>
      <stop offset="0.2" stop-color="#1C2436"/>
      <stop offset="0.4" stop-color="#192030"/>
      <stop offset="0.55" stop-color="#161C2B"/>
      <stop offset="0.7" stop-color="#121723"/>
      <stop offset="0.88" stop-color="#0D1119"/>
